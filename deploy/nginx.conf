server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # لا تُرجع index.html لملفات البناء — هذا يسبب MIME text/html على .js
    location /assets/ {
        try_files $uri =404;
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
            application/vnd.ms-fontobject eot;
            font/ttf ttf;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
